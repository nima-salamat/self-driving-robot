<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Stream Login · Self Driving Robot</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#08111f;color:#e6edf7}
*{box-sizing:border-box}
body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at top,#142845 0,transparent 55%),#08111f}
main{width:min(100%,390px);padding:30px;border:1px solid #334155;border-radius:16px;background:#101c2e;box-shadow:0 24px 80px #0005}
.mark{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,#22d3ee,#6366f1);margin-bottom:22px}
h1{font-size:1.4rem;margin:0 0 7px}
p{color:#aab8ca;line-height:1.5;margin:0 0 24px;font-size:.94rem}
label{display:block;font-size:.88rem;font-weight:600;margin:16px 0 7px}
input{width:100%;padding:12px 13px;border:1px solid #40516a;border-radius:8px;background:#081321;color:#f8fafc;font:inherit;outline-offset:2px}
input:focus{border-color:#38bdf8;outline:2px solid #38bdf833}
button{width:100%;margin-top:23px;border:0;border-radius:8px;padding:12px;background:#0ea5e9;color:#031525;font:inherit;font-weight:750;cursor:pointer}
button:hover{background:#38bdf8}
.error{padding:10px 12px;border:1px solid #9f343c;border-radius:8px;background:#4c1720;color:#fecdd3;margin:0 0 14px;font-size:.9rem}
small{display:block;margin-top:18px;color:#8192a9;line-height:1.5}
</style>
</head>
<body>
<main>
<div class="mark" aria-hidden="true"></div>
<h1>Stream dashboard</h1>
<p>Sign in to view robot telemetry and dashboard controls.</p>
{% if error %}<div class="error" role="alert">{{ error }}</div>{% endif %}
<form method="post" action="{{ url_for('stream_login') }}" autocomplete="on">
<label for="username">Username</label>
<input id="username" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
<label for="password">Password</label>
<input id="password" name="password" type="password" autocomplete="current-password" required>
<button type="submit">Sign in</button>
</form>
<small>Use this dashboard only on a trusted network. Standard HTTP connections do not encrypt login credentials.</small>
</main>
</body>
</html>
