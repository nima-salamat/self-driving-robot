name: Arduino firmware

on:
  push:
    paths:
      - "arduino/main_configurable_v1.ino"
      - "arduino/main_nonBlocking_v2.ino"
      - ".github/workflows/arduino-configurable.yml"
  pull_request:
    paths:
      - "arduino/main_configurable_v1.ino"
      - "arduino/main_nonBlocking_v2.ino"
      - ".github/workflows/arduino-configurable.yml"

jobs:
  compile-firmware:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install AVR core
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr

      - name: Compile Mega2560 configurable firmware
        run: |
          arduino-cli compile \
            --fqbn arduino:avr:mega:cpu=atmega2560 \
            arduino/main_configurable_v1.ino

      - name: Compile Mega2560 non-blocking v2 firmware
        run: |
          arduino-cli compile \
            --fqbn arduino:avr:mega:cpu=atmega2560 \
            arduino/main_nonBlocking_v2.ino
