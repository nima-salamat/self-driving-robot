name: Python tests

on:
  push:
    branches: [main, system-hardening, multiprocessing]
  pull_request:
    branches: [main]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pyserial numpy opencv-python-headless flask flask-socketio onnxruntime
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check JavaScript syntax
        run: node --check python/stream/static/stream-state.js && node --check python/stream/static/stream-core.js && node --check python/stream/static/stream-extensions.js && node --check python/stream/static/stream-workbench.js
      - name: Test browser-side state helpers
        run: node --test python/test/test_stream_state.test.js
      - name: Install Playwright
        run: npm install --no-save playwright@1.55.0
      - name: Install Chromium for Stream UI smoke tests
        run: npx playwright install --with-deps chromium
      - name: Run Stream browser smoke test
        run: node python/test/test_stream_browser.test.js
      - name: Compile Python
        run: python -m compileall -q python
      - name: Run hardware-free unit tests
        run: PYTHONPATH=python python -m unittest discover -s python/test -p 'test_unit_*.py' -v