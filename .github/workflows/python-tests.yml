name: Python tests

on:
  push:
    branches: [main, system-hardening]
  pull_request:
    branches: [main]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pyserial numpy opencv-python-headless flask onnxruntime
      - name: Compile Python
        run: python -m compileall -q python
      - name: Run hardware-free unit tests
        run: PYTHONPATH=python python -m unittest discover -s python/test -p 'test_unit_*.py' -v